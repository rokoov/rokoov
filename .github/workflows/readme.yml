name: Update README art

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [scripts/**]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/generate.py
        env:
          GH_TOKEN: ${{ secrets.README_TOKEN || github.token }}
      - run: |
          git config user.name "rokoov"
          git config user.email "rokoodev@gmail.com"
          git add assets
          git diff --staged --quiet || git commit -m "Update README art"
          git push
